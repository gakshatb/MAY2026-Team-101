  /citizen/complaints/{complaintId}/tracking:
    get:
      tags:
        - Citizen Services
      summary: |
        **US1, US5, US6, US7, US8, US9**
        Track complaint status history
      description: |
        **All Citizen Stories:** Track complaint progress through the resolution lifecycle.
        
        Returns:
        - Current status with timestamp
        - Full status change history with remarks
        - Who changed the status (system/worker/officer)
        - Estimated completion time
        
        **User Story Mapping:**
        - US5: Shop owner tracks garbage complaint progress
        - US6: Working professional tracks streetlight repair
        - US7: College student tracks pothole repair
        - US8: Local resident tracks dustbin resolution
        - US9: Local resident tracks drainage clearance
      operationId: trackComplaint
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ComplaintIdParam'
      responses:
        '200':
          description: Tracking information
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  current_status:
                    type: string
                  status_timeline:
                    type: array
                    items:
                      type: object
                      properties:
                        old_status:
                          type: string
                          nullable: true
                        new_status:
                          type: string
                        remark:
                          type: string
                          nullable: true
                        changed_by:
                          type: string
                        changed_at:
                          type: string
                          format: date-time
                  estimated_completion:
                    type: string
                    format: date-time
                    nullable: true
                  sla_breach:
                    type: boolean
                    description: "Whether complaint has breached SLA"
        '401':
