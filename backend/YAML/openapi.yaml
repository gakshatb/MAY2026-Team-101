  # ============================================
  # OFFICER ENDPOINTS (US2)
  # ============================================
  /officer/complaints:
    get:
      tags:
        - Officer Services
      summary: |
        **US2** (Lallu Prashanth)
        Get all complaints in officer's jurisdiction
      description: |
        **User Story:** As a municipal officer, I want to assign complaints to field workers and track their progress so that complaints are resolved efficiently.
        
        **Officer Capabilities:**
        - View all complaints in their ward/department
        - Filter by status, priority, category
        - Sort by date, priority, or status
        - View unassigned complaints needing attention
        - Monitor worker performance metrics
      operationId: getOfficerComplaints
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, assigned, in_progress, resolved, closed, rejected, all]
            default: all
        - name: priority
          in: query
          schema:
            type: string
            enum: [Low, Medium, High, Emergency]
        - name: category
          in: query
          schema:
            type: string
            enum: [Road, Drainage, Electricity, Water, Garbage, Streetlight, Other]
        - name: assigned
          in: query
          schema:
            type: boolean
            description: "True for assigned, False for unassigned"
        - name: ward
          in: query
          schema:
            type: string
          description: "Filter by ward number"
        - name: fromDate
          in: query
          schema:
            type: string
            format: date
        - name: toDate
          in: query
          schema:
            type: string
            format: date
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            maximum: 200
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: List of complaints with officer view
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  total:
                    type: integer
                  pending_count:
                    type: integer
                  summary:
                    type: object
                    properties:
                      total:
                        type: integer
                      unassigned:
                        type: integer
                      overdue:
                        type: integer
                      emergency:
                        type: integer
                  complaints:
                    type: array
                    items:
                      allOf:
                        - $ref: '#/components/schemas/Complaint'
                        - type: object
                          properties:
                            worker_name:
                              type: string
                              nullable: true
                            days_open:
                              type: integer
                            sla_breached:
                              type: boolean
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /officer/complaints/{complaintId}/assign:
    patch:
      tags:
        - Officer Services
      summary: |
        **US2** (Lallu Prashanth)
        Assign complaint to a field worker
      description: |
        **US2:** Assign complaints to field workers and track their progress.
        
        **Business Rules:**
        - Only officers can assign complaints
        - Worker must be in the same ward/department
        - Worker's workload is considered (max 15 active complaints)
        - Deadline automatically calculated based on priority
        - Notification sent to worker and citizen
      operationId: assignComplaint
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ComplaintIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - workerId
              properties:
                workerId:
                  type: integer
                  description: "ID of the field worker to assign"
                  example: 2034
                deadline:
                  type: string
                  format: date
                  description: "Optional custom deadline (default: based on priority)"
                  example: "2026-07-30"
                notes:
                  type: string
                  maxLength: 500
                  example: "Please prioritize this as it's near the school"
      responses:
        '200':
          description: Complaint assigned successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Complaint assigned to Sarmadh Ameer successfully."
                  assignment:
                    $ref: '#/components/schemas/WorkerAssignment'
                  worker:
                    type: object
                    properties:
                      id:
                        type: integer
                      name:
                        type: string
                      mobile:
                        type: string
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          description: Worker unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: "Worker is already assigned to 15 active complaints. Please choose another worker."
                code: "ASSIGN_001"
                available_workers:
                  - id: 2035
                    name: "Rajesh Kumar"
                    workload: 8
                  - id: 2036
                    name: "Priya Sharma"
                    workload: 5

  /officer/complaints/{complaintId}/reassign:
    patch:
      tags:
        - Officer Services
      summary: |
        **US2** (Lallu Prashanth)
        Reassign complaint to another worker
      description: |
        **US2:** Reassign complaint if current worker is unable to complete.
      operationId: reassignComplaint
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ComplaintIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - workerId
              properties:
                workerId:
                  type: integer
                reason:
                  type: string
                  minLength: 20
                  maxLength: 500
      responses:
        '200':
          description: Complaint reassigned
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /officer/dashboard:
    get:
      tags:
        - Officer Services
      summary: |
        **US2** (Lallu Prashanth)
        Officer dashboard
      description: |
        **US2:** Get comprehensive dashboard with:
        - Complaint statistics
        - Worker performance
        - Ward-wise breakdown
        - SLA compliance metrics
        - Priority distribution
      operationId: getOfficerDashboard
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Dashboard data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfficerDashboard'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /officer/workers:
    get:
      tags:
        - Officer Services
      summary: |
        **US2** (Lallu Prashanth)
        Get list of available workers
      description: |
        **US2:** View all field workers in officer's jurisdiction with workload status.
      operationId: getWorkers
      security:
        - BearerAuth: []
      parameters:
        - name: availability
          in: query
          schema:
            type: boolean
          description: "True for available workers (workload < 15)"
        - name: ward
          in: query
          schema:
            type: string
        - name: skill
          in: query
          schema:
            type: string
            enum: [Road, Drainage, Electricity, Water, Garbage, Streetlight, General]
      responses:
        '200':
          description: List of workers
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  workers:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        name:
                          type: string
                        mobile:
                          type: string
                        ward:
                          type: string
                        skills:
                          type: array
                          items:
                            type: string
                        active_complaints:
                          type: integer
                        rating:
                          type: number
                          format: float
                        availability:
                          type: boolean
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  # ============================================
  # WORKER ENDPOINTS (US3)
  # ============================================
  /worker/complaints:
    get:
      tags:
        - Worker Services
      summary: |
        **US3** (Sarmadh Ameer)
        View assigned complaints
      description: |
        **User Story:** As a field worker, I want to view my assigned complaints and update their status with proof of completion so that officers and citizens know the work has been completed.
        
        **Worker Capabilities:**
        - View all assigned complaints
        - Filter by status (pending, in_progress, completed)
        - Sort by priority or deadline
        - View complaint details and location
        - Update status with proof
        - Mark work as completed
      operationId: getWorkerComplaints
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, in_progress, completed, all]
            default: all
        - name: priority
          in: query
          schema:
            type: string
            enum: [Emergency, High, Medium, Low]
        - name: sortBy
          in: query
          schema:
            type: string
            enum: [deadline, priority, assigned_date]
            default: deadline
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
      responses:
        '200':
          description: List of assigned complaints
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  total:
                    type: integer
                  pending_count:
                    type: integer
                  in_progress_count:
                    type: integer
                  completed_count:
                    type: integer
                  complaints:
                    type: array
                    items:
                      allOf:
                        - $ref: '#/components/schemas/Complaint'
                        - type: object
                          properties:
                            deadline:
                              type: string
                              format: date
                            days_remaining:
                              type: integer
                            is_overdue:
                              type: boolean
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /worker/complaints/{complaintId}/status:
    patch:
      tags:
        - Worker Services
      summary: |
        **US3** (Sarmadh Ameer)
        Update complaint status
      description: |
        **US3:** Update status of assigned complaint with proof of completion.
        
        **Workflow:**
        1. Worker accepts assignment (status: pending → in_progress)
        2. Worker works on complaint
        3. Worker completes work (status: in_progress → resolved)
        4. Worker uploads proof of completion
        5. Officer verifies and closes (status: resolved → closed)
        
        **Business Rules:**
        - Only assigned worker can update status
        - Status transitions must follow workflow
        - Proof required for 'resolved' status
        - Comments required for any status change
      operationId: updateComplaintStatus
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ComplaintIdParam'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - status
                - comment
              properties:
                status:
                  type: string
                  enum: [pending, in_progress, resolved, rejected]
                  description: "New status for the complaint"
                comment:
                  type: string
                  minLength: 10
                  maxLength: 500
                  description: "Comment about the work done or reason for status change"
                proofImage:
                  type: string
                  format: binary
                  description: "Photo proof of work completion (required for 'resolved' status)"
                proofVideo:
                  type: string
                  format: binary
                  description: "Video proof of work completion (optional)"
                notes:
                  type: string
                  maxLength: 1000
                  description: "Additional notes for the officer"
      responses:
        '200':
          description: Status updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                  complaint:
                    $ref: '#/components/schemas/Complaint'
                  updated_at:
                    type: string
                    format: date-time
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          description: Not assigned to this complaint
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: "You are not assigned to this complaint."
                code: "WORK_001"
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          description: Invalid status transition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: "Invalid status transition from 'pending' to 'resolved'."
                code: "WORK_002"
                valid_transitions: ["in_progress"]

  /worker/complaints/{complaintId}/proof:
    post:
      tags:
        - Worker Services
      summary: |
        **US3** (Sarmadh Ameer)
        Upload proof of completion
      description: |
        **US3:** Upload additional proof photos/videos for completed work.
      operationId: uploadProof
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ComplaintIdParam'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                images:
                  type: array
                  items:
                    type: string
                    format: binary
                  description: "Proof images (max 5 files, each <= 5MB)"
                videos:
                  type: array
                  items:
                    type: string
                    format: binary
                  description: "Proof videos (max 2 files, each <= 50MB)"
                note:
                  type: string
                  maxLength: 500
      responses:
        '200':
          description: Proof uploaded
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Proof uploaded successfully."
                  uploaded_files:
                    type: array
                    items:
                      type: string
                  total_count:
                    type: integer
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /worker/dashboard:
    get:
      tags:
        - Worker Services
      summary: |
        **US3** (Sarmadh Ameer)
        Worker dashboard
      description: |
        **US3:** Get worker's dashboard with:
        - Summary of assigned complaints
        - Performance metrics
        - Upcoming deadlines
        - Recent completions
        - Rating history
      operationId: getWorkerDashboard
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Worker dashboard
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  summary:
                    type: object
                    properties:
                      assigned:
                        type: integer
                      in_progress:
                        type: integer
                      completed_this_week:
                        type: integer
                      pending:
                        type: integer
                      overdue:
                        type: integer
                  performance:
                    type: object
                    properties:
                      avg_completion_time:
                        type: number
                        description: "Average time to resolve in hours"
                      completion_rate:
                        type: number
                        description: "Percentage of complaints completed"
                      rating:
                        type: number
                        format: float
                        description: "Average rating from citizens"
                  upcoming_deadlines:
                    type: array
                    items:
                      type: object
                      properties:
                        complaint_id:
                          type: string
                        title:
                          type: string
                        deadline:
                          type: string
                          format: date
                        days_left:
                          type: integer
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

