          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  complaint:
                    $ref: '#/components/schemas/Complaint'
                  activity_log:
                    type: array
                    items:
                      $ref: '#/components/schemas/ActivityLog'
                  estimatedResolution:
                    type: string
                    format: date
                    nullable: true
                    description: "Estimated date of resolution based on priority and department"
        '401':
