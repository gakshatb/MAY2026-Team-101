        '401':
          $ref: '#/components/responses/UnauthorizedError'

  # ============================================
  # CITIZEN COMPLAINT ENDPOINTS
  # ============================================
  /citizen/complaints:
    post:
      tags:
        - Citizen Services
      summary: |
        **US1, US5, US6, US7, US8, US9**
        Submit a new complaint
      description: |
        **User Stories:**
        - **US1** (Murali K GB): Submit civic complaint with photos and location
        - **US5** (Priyanshu Singh): Report garbage issues with location details
        - **US6** (Omkar Jaiswal): Report faulty streetlight with location and track
        - **US7** (Mangalam Shrivastav): Report potholes near college with exact location
        - **US8** (Dhruv Raghav): Report overflowing/missing dustbins with location
        - **US9** (Azhar Mohd): Report blocked drainage with exact location
        
        Citizens can submit complaints with:
        - Title, category, description (min 30 characters)
        - Location details (ward, area, street, pincode)
        - Optional photos (max 5, each <= 5MB)
        - Priority level (Low/Medium/High/Emergency)
        - GPS coordinates (latitude, longitude)
        
        **Business Rules:**
        - Emergency priority automatically escalates response time
        - Garbage category routes to Sanitation Department
        - Streetlight category routes to Electrical Department
        - Road category routes to Roads & Infrastructure Department
        - Drainage category routes to Sewage & Drainage Department
      operationId: submitComplaint
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              allOf:
                - $ref: '#/components/schemas/ComplaintInput'
                - type: object
                  properties:
                    images:
                      type: array
                      items:
                        type: string
                        format: binary
                      description: "Image files (PNG, JPG, JPEG, WEBP), max 5 files, each <= 5MB"
                    image:
                      type: string
                      format: binary
                      description: "Single image upload (for backward compatibility)"
      responses:
        '201':
          description: Complaint submitted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Complaint submitted successfully."
                  complaint:
                    $ref: '#/components/schemas/Complaint'
                  trackingLink:
                    type: string
                    example: "https://api.municipal.gov.in/public/track/CMP-2026-001234"
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '413':
          description: Image file too large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: "Image file size exceeds 5MB limit"
                code: "FILE_001"
        '415':
          description: Unsupported image format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: "Unsupported file format. Please upload PNG, JPG, JPEG, or WEBP."
                code: "FILE_002"
        '429':
          $ref: '#/components/responses/RateLimitError'

    get:
      tags:
        - Citizen Services
      summary: |
        **US1, US5, US6, US7, US8, US9**
        List citizen's complaints
      description: |
        **All Citizen Stories:** Track all complaints submitted by the citizen.
        
        Get a list of complaints with optional filtering by status or search.
        
        **Filtering Options:**
        - status: pending, assigned, in_progress, resolved, closed, rejected, All
        - search: Search in title and description
        - category: Filter by specific category
        - dateFrom, dateTo: Filter by submission date range
      operationId: getCitizenComplaints
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, assigned, in_progress, resolved, closed, rejected, All]
            default: All
          description: "Filter by complaint status"
          example: "pending"
        - name: search
          in: query
          schema:
            type: string
            minLength: 2
          description: "Search in title, description, or category"
          example: "streetlight"
        - name: category
          in: query
          schema:
            type: string
            enum: [Road, Drainage, Electricity, Water, Garbage, Streetlight, Other]
          description: "Filter by category"
          example: "Garbage"
        - name: dateFrom
          in: query
          schema:
            type: string
            format: date
          description: "Filter complaints submitted after this date"
          example: "2026-07-01"
        - name: dateTo
          in: query
          schema:
            type: string
            format: date
          description: "Filter complaints submitted before this date"
          example: "2026-07-31"
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
          description: "Number of complaints to return"
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
            minimum: 0
          description: "Number of complaints to skip"
      responses:
        '200':
          description: List of complaints
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  total:
                    type: integer
                    example: 45
                  limit:
                    type: integer
                    example: 20
                  offset:
                    type: integer
                    example: 0
                  complaints:
                    type: array
                    items:
                      $ref: '#/components/schemas/Complaint'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /citizen/complaints/summary:
    get:
      tags:
        - Citizen Services
      summary: |
        **US1, US5, US6, US7, US8, US9**
