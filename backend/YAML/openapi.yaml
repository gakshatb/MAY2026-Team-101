        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /citizen/complaints/{complaintId}/feedback:
    post:
      tags:
        - Citizen Services
      summary: |
        **US1, US5, US6, US7, US8, US9**
        Submit feedback for resolved complaint
      description: |
        **All Citizen Stories:** Provide feedback after complaint resolution.
        
        **Business Rules:**
        - Feedback can only be submitted for 'resolved' complaints
        - One feedback per complaint
        - Minimum comment length: 20 characters
        - All ratings and comments help improve services
        
        **User Story Benefits:**
        - Ensures quality of service delivery
        - Holds municipality accountable
        - Improves future complaint handling
      operationId: submitFeedback
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ComplaintIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - overallRating
                - comment
              properties:
                overallRating:
                  type: integer
                  minimum: 1
                  maximum: 5
                  description: "Overall experience rating (1=Very Poor, 5=Excellent)"
                  example: 4
                serviceRatings:
                  type: object
                  properties:
                    responseTime:
                      type: integer
                      minimum: 1
                      maximum: 5
                      description: "Rating for response time"
                    resolutionQuality:
                      type: integer
                      minimum: 1
                      maximum: 5
                      description: "Rating for quality of resolution"
                    communication:
                      type: integer
                      minimum: 1
                      maximum: 5
                      description: "Rating for communication during process"
                categories:
                  type: array
                  items:
                    type: string
                    enum: [Timeliness, Quality, Communication, Professionalism, Overall]
                  description: "Aspect categories being rated"
                comment:
                  type: string
                  minLength: 20
                  maxLength: 1000
                  example: "The streetlight was repaired within 48 hours. The worker was professional and kept us informed."
                improvement:
                  type: string
                  maxLength: 500
                  nullable: true
                  example: "Could provide estimated time of completion earlier"
                wouldRecommend:
                  type: string
                  enum: [Yes, No, Maybe]
                  example: "Yes"
                anonymous:
                  type: boolean
                  default: false
                  description: "Whether to keep feedback anonymous"
      responses:
        '201':
          description: Feedback submitted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Thank you! Your feedback has been submitted."
                  feedbackId:
                    type: integer
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'

    get:
      tags:
        - Citizen Services
      summary: |
        **US1, US5, US6, US7, US8, US9**
        Get submitted feedback
      description: |
        **All Citizen Stories:** View feedback already submitted for a complaint.
      operationId: getFeedback
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ComplaintIdParam'
      responses:
        '200':
          description: Feedback retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  feedback:
                    $ref: '#/components/schemas/Feedback'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          description: Complaint not found or no feedback
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrorResponse'
                  - type: object
                    properties:
                      success:
                        type: boolean
                        example: false
                      message:
                        type: string
                        example: "No feedback has been submitted for this complaint"

  /citizen/complaints/{complaintId}/escalate:
    post:
      tags:
        - Citizen Services
      summary: |
        **US1, US5, US6, US7, US8, US9**
        Escalate a complaint
      description: |
        **All Citizen Stories:** Escalate complaint if not resolved within SLA.
        
        **Business Rules:**
        - Only pending/in_progress complaints can be escalated
        - Citizen can escalate once per complaint
        - Escalation requires a reason
        - Escalation sends notification to higher authorities
        
        **SLA Guidelines:**
        - Emergency: 24 hours
        - High: 48 hours
        - Medium: 5 days
        - Low: 7 days
      operationId: escalateComplaint
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ComplaintIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - reason
              properties:
                reason:
                  type: string
                  minLength: 20
                  maxLength: 500
                  example: "The complaint is unresolved for 5 days despite being marked as High priority. The streetlight is still not functioning and creating safety issues."
      responses:
        '200':
          description: Complaint escalated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Complaint has been escalated to higher authorities."
                  escalationId:
                    type: integer
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          description: Already escalated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: "This complaint has already been escalated."
                code: "ESC_001"

  # ============================================
  # CITIZEN BOOKING ENDPOINTS (US4)
  # ============================================
  /citizen/bookings:
    post:
      tags:
        - Citizen Services
      summary: |
        **US4** (Ramakrishnan)
        Book a public facility
      description: |
        **User Story:** As a citizen, I want to book a public facility and track my booking status so that I can use the facility on my preferred date.
        
        **Available Facilities:**
        - Community Halls
        - Parks & Gardens
        - Sports Grounds
        - Auditoriums
        - Function Halls
        
        **Business Rules:**
        - Booking must be at least 24 hours in advance
        - Maximum booking duration: 12 hours
        - Facilities can be booked up to 30 days in advance
        - Booking requires refundable deposit
        - No overlapping bookings for same facility
        - Cancellation allowed up to 48 hours before booking
      operationId: createBooking
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - facilityId
                - facilityType
                - bookingDate
                - startTime
                - endTime
                - purpose
                - numberOfPeople
              properties:
                facilityId:
                  type: integer
                  description: "ID of the facility to book"
                  example: 105
                facilityType:
                  type: string
                  enum: [CommunityHall, Park, SportsGround, Auditorium, FunctionHall]
                  example: "CommunityHall"
                bookingDate:
                  type: string
                  format: date
                  example: "2026-08-15"
                startTime:
                  type: string
                  pattern: '^([0-1][0-9]|2[0-3]):[0-5][0-9]$'
                  example: "09:00"
                endTime:
                  type: string
                  pattern: '^([0-1][0-9]|2[0-3]):[0-5][0-9]$'
                  example: "17:00"
                purpose:
                  type: string
                  minLength: 10
                  maxLength: 200
                  example: "Wedding Reception"
                numberOfPeople:
                  type: integer
                  minimum: 1
                  maximum: 500
                  example: 100
                amenities:
                  type: array
                  items:
                    type: string
                    enum: [Parking, Catering, Stage, Lighting, SoundSystem, AC, WiFi]
                  example: ["Parking", "Stage"]
                specialRequests:
                  type: string
                  maxLength: 500
                  example: "Need extra chairs and a sound system"
                contactNumber:
                  type: string
                  pattern: '^[0-9]{10}$'
                  example: "9876543210"
      responses:
        '201':
          description: Booking created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Booking created successfully. Please pay the deposit to confirm."
                  booking:
                    $ref: '#/components/schemas/FacilityBooking'
                  depositAmount:
                    type: number
                    format: float
                    example: 500.00
                  paymentLink:
                    type: string
                    example: "https://api.municipal.gov.in/payment/booking/BKG-2026-001234"
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '409':
          description: Facility already booked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: "Facility is already booked for the selected time slot."
                code: "BKG_001"
                available_slots:
                  - "2026-08-16 14:00-17:00"
                  - "2026-08-17 09:00-12:00"

    get:
      tags:
        - Citizen Services
      summary: |
        **US4** (Ramakrishnan)
        List citizen's bookings
      description: |
        **US4:** View all facility bookings made by the citizen.
        
        **Filter Options:**
        - status: pending, confirmed, rejected, completed, cancelled, All
        - dateFrom, dateTo: Filter by booking date
      operationId: getCitizenBookings
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, confirmed, rejected, completed, cancelled, All]
            default: All
          description: "Filter by booking status"
        - name: dateFrom
          in: query
          schema:
            type: string
            format: date
          description: "Filter bookings from this date"
        - name: dateTo
          in: query
          schema:
            type: string
            format: date
          description: "Filter bookings until this date"
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 50
      responses:
        '200':
          description: List of bookings
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  total:
                    type: integer
                  bookings:
                    type: array
                    items:
                      $ref: '#/components/schemas/FacilityBooking'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /citizen/bookings/{bookingId}:
    get:
      tags:
        - Citizen Services
      summary: |
        **US4** (Ramakrishnan)
        Get booking details
      description: |
        **US4:** View full details of a specific facility booking.
      operationId: getBookingDetails
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BookingIdParam'
      responses:
        '200':
          description: Booking details
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  booking:
                    $ref: '#/components/schemas/FacilityBooking'
                  payment_status:
                    type: string
                    enum: [pending, paid, refunded]
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /citizen/bookings/{bookingId}/cancel:
    post:
      tags:
        - Citizen Services
      summary: |
        **US4** (Ramakrishnan)
        Cancel booking
      description: |
        **US4:** Cancel a facility booking.
        
        **Business Rules:**
        - Cancellation allowed up to 48 hours before booking
        - Deposit refunded for cancellations > 72 hours
        - 50% deposit refunded for cancellations 48-72 hours
        - No refund for cancellations < 48 hours
      operationId: cancelBooking
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BookingIdParam'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  maxLength: 500
                  example: "Change of plans"
      responses:
        '200':
          description: Booking cancelled
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                  refundAmount:
                    type: number
                    format: float
                  refundDate:
                    type: string
                    format: date
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          description: Cannot cancel
          content:
            application/json:
