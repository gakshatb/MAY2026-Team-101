openapi: 3.0.0
info:
  title: Municipal Citizen Complaint & Facility Management System
  description: |
    A comprehensive platform enabling citizens to report civic issues, municipal officers to 
    manage complaints, and field workers to update resolution progress.

    ## User Stories Mapping
    
    ### US1: Submit Civic Complaint with Photos
    **As a** Citizen (Murali K GB)  
    **I want to** submit a civic complaint with photos and location  
    **So that** the municipality can resolve the issue  
    **APIs:** POST /api/citizen/complaints, GET /api/citizen/complaints/{id}

    ### US2: Assign and Track Complaints
    **As a** Municipal Officer (Lallu Prashanth)  
    **I want to** assign complaints to field workers and track their progress  
    **So that** complaints are resolved efficiently  
    **APIs:** PATCH /api/officer/complaints/{id}/assign, GET /api/officer/complaints, GET /api/officer/complaints/{id}/tracking

    ### US3: Update Status with Proof
    **As a** Field Worker (Sarmadh Ameer)  
    **I want to** view my assigned complaints and update their status with proof of completion  
    **So that** officers and citizens know the work has been completed  
    **APIs:** GET /api/worker/complaints, PATCH /api/worker/complaints/{id}/status, POST /api/worker/complaints/{id}/proof

    ### US4: Book Public Facility
    **As a** Citizen (Ramakrishnan)  
    **I want to** book a public facility and track my booking status  
    **So that** I can use the facility on my preferred date  
    **APIs:** POST /api/citizen/bookings, GET /api/citizen/bookings/{id}

    ### US5: Report Garbage Issues
    **As a** Shop Owner (Priyanshu Singh)  
    **I want to** report garbage-related issues with location details  
    **So that** the area around my shop remains clean  
    **APIs:** POST /api/citizen/complaints (category: Garbage), GET /api/citizen/complaints/{id}/tracking

    ### US6: Report Faulty Streetlight
    **As a** Working Professional (Omkar Jaiswal)  
    **I want to** report a faulty streetlight with location and track progress  
    **So that** I can travel safely at night  
    **APIs:** POST /api/citizen/complaints (category: Streetlight), GET /api/citizen/complaints/{id}/tracking

    ### US7: Report Potholes
    **As a** College Student (Mangalam Shrivastav)  
    **I want to** report potholes near my college with exact location  
    **So that** students and commuters can travel safely  
    **APIs:** POST /api/citizen/complaints (category: Road), GET /api/citizen/complaints/{id}/tracking

    ### US8: Report Overflowing Dustbins
    **As a** Local Resident (Dhruv Raghav)  
    **I want to** report overflowing or missing public dustbins with location  
    **So that** my locality remains clean and hygienic  
    **APIs:** POST /api/citizen/complaints (category: Garbage), GET /api/citizen/complaints/{id}/tracking

    ### US9: Report Blocked Drainage
    **As a** Local Resident (Azhar Mohd)  
    **I want to** report blocked drainage with exact location and track  
    **So that** roads remain clean and safe, especially during rainy season  
    **APIs:** POST /api/citizen/complaints (category: Drainage), GET /api/citizen/complaints/{id}/tracking

  version: 1.0.0
  contact:
    name: Municipal Corporation Support
    email: support@municipal.gov.in
    url: https://municipal.gov.in/support

servers:
  - url: https://api.municipal.gov.in/v1
    description: Production server
  - url: https://staging-api.municipal.gov.in/v1
    description: Staging server
  - url: http://localhost:5000/api
    description: Local development server

tags:
  - name: Authentication
    description: User authentication, registration, and account management
  - name: Citizen Services
    description: |
      **User Stories:** US1, US4, US5, US6, US7, US8, US9
      Complaint submission, tracking, feedback, profile management, and facility booking for citizens
  - name: Officer Services
    description: |
      **User Stories:** US2
      Complaint assignment, monitoring, and management for municipal officers
  - name: Worker Services
    description: |
      **User Stories:** US3
      Complaint viewing, status updates, and proof submission for field workers
  - name: Public Services
    description: Public-facing APIs for checking complaint status without login

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT token obtained from /api/login endpoint.
        Format: Bearer {access_token}
        Token expires in 15 minutes.

  schemas:
    # ============ ERROR SCHEMAS ============
    ErrorResponse:
      type: object
      required:
        - success
        - message
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          description: Human-readable error message
        code:
          type: string
          description: Error code for API consumers
        timestamp:
          type: string
          format: date-time
          description: ISO 8601 timestamp
        path:
          type: string
          description: API endpoint path

    ValidationError:
      type: object
      required:
        - success
        - message
        - errors
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: "Validation failed"
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          description: Field-specific validation errors

    AuthenticationError:
      type: object
      required:
        - success
        - message
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: "Authentication required"
        code:
          type: string
          example: "AUTH_001"

    AuthorizationError:
      type: object
      required:
        - success
        - message
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: "Insufficient permissions"
        code:
          type: string
          example: "AUTH_002"

    # ============ USER SCHEMAS ============
    User:
      type: object
      properties:
        id:
          type: integer
          example: 1001
        fullName:
          type: string
          example: "Murali K GB"
        email:
          type: string
          format: email
          example: "murali@example.com"
        mobile:
          type: string
          pattern: '^[0-9]{10}$'
          example: "9876543210"
        role:
          type: string
          enum: [Citizen, Officer, Worker, Admin]
          example: "Citizen"
        status:
          type: string
          enum: [active, pending, disabled]
          example: "active"
        profilePhoto:
          type: string
          nullable: true
          example: "https://api.municipal.gov.in/uploads/profile/photo_123.jpg"
        createdAt:
          type: string
          format: date-time
          nullable: true

    # ============ COMPLAINT SCHEMAS ============
    Complaint:
      type: object
      required:
        - id
        - title
        - category
        - description
        - ward
        - area
        - street
      properties:
        id:
          type: string
          example: "CMP-2026-001234"
          description: "Format: CMP-YYYY-XXXXX"
        rawId:
          type: integer
          example: 1234
          description: "Internal numeric ID"
        title:
          type: string
          minLength: 5
          maxLength: 200
          example: "Broken streetlight near MG Road"
        category:
          type: string
          enum: [Road, Drainage, Electricity, Water, Garbage, Streetlight, Other]
          example: "Streetlight"
        subCategory:
          type: string
          description: "Specific sub-category for better routing"
          example: "Faulty bulb"
        priority:
          type: string
          enum: [Low, Medium, High, Emergency]
          default: "Medium"
          example: "High"
        description:
          type: string
          minLength: 30
          maxLength: 2000
          example: "The streetlight at the corner of MG Road and Brigade Road has been flickering for a week and is completely dead since yesterday. This is a busy intersection with heavy pedestrian traffic."
        location:
          type: object
          properties:
            address:
              type: string
              example: "123, MG Road, Brigade Area, Bengaluru - 560001"
            ward:
              type: string
              example: "Ward 12"
            area:
              type: string
              example: "Brigade Area"
            street:
              type: string
              example: "MG Road"
            landmark:
              type: string
              nullable: true
              example: "Near ICICI Bank ATM"
            city:
              type: string
              example: "Bengaluru"
            state:
              type: string
              example: "Karnataka"
            pincode:
              type: string
              pattern: '^[0-9]{6}$'
              example: "560001"
            latitude:
              type: number
              format: float
              example: 12.9716
            longitude:
              type: number
              format: float
              example: 77.5946
        incidentDate:
          type: string
          format: date
          nullable: true
          example: "2026-07-15"
        visitTime:
          type: string
          nullable: true
          example: "10:00 AM"
        urgencyNote:
          type: string
          nullable: true
          example: "School children cross this road daily"
        images:
          type: array
          maxItems: 5
          items:
            type: string
            format: uri
            example: "https://api.municipal.gov.in/uploads/complaints/CMP-2026-001234/image1.jpg"
        status:
          type: string
          enum: [pending, assigned, in_progress, resolved, closed, rejected]
          example: "pending"
        department:
          type: string
          example: "Street Lighting Department"
        assignedTo:
          type: integer
          nullable: true
          description: "Worker ID if assigned"
          example: 2034
        assignedToName:
          type: string
          nullable: true
          example: "Sarmadh Ameer"
        assignedBy:
          type: integer
          nullable: true
          description: "Officer ID who assigned"
          example: 1025
        assignedAt:
          type: string
          format: date-time
          nullable: true
          example: "2026-07-16T10:30:00Z"
        resolvedAt:
          type: string
          format: date-time
          nullable: true
          example: "2026-07-20T14:00:00Z"
        createdAt:
          type: string
          format: date-time
          example: "2026-07-15T09:15:00Z"
        updatedAt:
          type: string
          format: date-time
          example: "2026-07-15T09:15:00Z"
        isEscalated:
          type: boolean
          default: false
        hasFeedback:
          type: boolean
          default: false
        feedback:
          $ref: '#/components/schemas/Feedback'

    ComplaintInput:
      type: object
      required:
        - title
        - category
        - description
        - ward
        - area
        - street
      properties:
        title:
          type: string
          minLength: 5
          maxLength: 200
        category:
          type: string
          enum: [Road, Drainage, Electricity, Water, Garbage, Streetlight, Other]
        subCategory:
          type: string
          maxLength: 100
        priority:
          type: string
          enum: [Low, Medium, High, Emergency]
          default: "Medium"
        description:
          type: string
          minLength: 30
          maxLength: 2000
        city:
          type: string
          example: "Bengaluru"
        ward:
          type: string
          example: "Ward 12"
        area:
          type: string
          example: "Brigade Area"
        street:
          type: string
          example: "MG Road"
        landmark:
          type: string
          maxLength: 200
        pincode:
          type: string
          pattern: '^[0-9]{6}$'
        incidentDate:
          type: string
          format: date
        visitTime:
          type: string
        urgencyNote:
          type: string
          maxLength: 500
        latitude:
          type: number
          format: float
          minimum: -90
          maximum: 90
        longitude:
          type: number
          format: float
          minimum: -180
          maximum: 180

    # ============ FEEDBACK SCHEMAS ============
    Feedback:
      type: object
      properties:
        id:
          type: integer
        complaintId:
          type: string
          example: "CMP-2026-001234"
        overallRating:
          type: integer
          minimum: 1
          maximum: 5
          example: 4
        serviceRatings:
          type: object
          properties:
            responseTime:
              type: integer
              minimum: 1
              maximum: 5
            resolutionQuality:
              type: integer
              minimum: 1
              maximum: 5
            communication:
              type: integer
              minimum: 1
              maximum: 5
        categories:
          type: array
          items:
            type: string
          example: ["Timeliness", "Quality", "Communication"]
        comment:
          type: string
          minLength: 20
          maxLength: 1000
          example: "The complaint was resolved quickly. The worker was professional and completed the work on time."
        improvement:
          type: string
          nullable: true
          maxLength: 500
          example: "Could improve communication about estimated completion time"
        wouldRecommend:
          type: string
          enum: [Yes, No, Maybe]
          example: "Yes"
        isAnonymous:
          type: boolean
          default: false
        submittedAt:
          type: string
          format: date-time

    # ============ NOTIFICATION SCHEMAS ============
    Notification:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
          example: "Complaint Assigned"
        message:
          type: string
          example: "Your complaint CMP-2026-001234 has been assigned to Sarmadh Ameer"
        type:
          type: string
          enum: [status_update, assignment, feedback_request, general]
        complaintId:
          type: string
          nullable: true
          example: "CMP-2026-001234"
        isRead:
          type: boolean
          default: false
        createdAt:
          type: string
          format: date-time

    # ============ BOOKING SCHEMAS ============
    FacilityBooking:
      type: object
      properties:
        id:
          type: string
          example: "BKG-2026-001234"
        facilityName:
          type: string
          example: "Community Hall A"
        facilityType:
          type: string
          enum: [CommunityHall, Park, SportsGround, Auditorium, FunctionHall]
        bookingDate:
          type: string
          format: date
        startTime:
          type: string
          example: "09:00"
        endTime:
          type: string
          example: "17:00"
        purpose:
          type: string
          example: "Wedding Reception"
        numberOfPeople:
          type: integer
        status:
          type: string
          enum: [pending, confirmed, rejected, completed, cancelled]
        amenities:
          type: array
          items:
            type: string
          example: ["Parking", "Catering", "Stage"]
        bookingAmount:
          type: number
          format: float
        depositAmount:
          type: number
          format: float
        bookingDateRequested:
          type: string
          format: date-time
        confirmedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    # ============ ACTIVITY LOG SCHEMAS ============
    ActivityLog:
      type: object
      properties:
        id:
          type: integer
        complaintId:
          type: string
          nullable: true
        bookingId:
          type: string
          nullable: true
        type:
          type: string
          enum: [submitted, assigned, status_change, proof_uploaded, escalated, resolved, feedback_submitted]
        description:
          type: string
        oldStatus:
          type: string
          nullable: true
        newStatus:
          type: string
          nullable: true
        remark:
          type: string
          nullable: true
        changedBy:
          type: integer
        changedByName:
          type: string
        changedAt:
          type: string
          format: date-time

    # ============ WORKER SCHEMAS ============
    WorkerAssignment:
      type: object
      properties:
        complaintId:
          type: string
        workerId:
          type: integer
        workerName:
          type: string
        assignedAt:
          type: string
          format: date-time
        deadline:
          type: string
          format: date
        priority:
          type: string
          enum: [Low, Medium, High, Emergency]
        status:
          type: string
          enum: [pending, in_progress, completed, delayed]
        proofImage:
          type: string
          format: uri
          nullable: true
        completionNote:
          type: string
          nullable: true

    # ============ OFFICER SCHEMAS ============
    OfficerDashboard:
      type: object
      properties:
        summary:
          type: object
          properties:
            totalComplaints:
              type: integer
            pendingAssignment:
              type: integer
            inProgress:
              type: integer
            resolvedToday:
              type: integer
            overdue:
              type: integer
            avgResolutionTime:
              type: number
              description: "Average resolution time in hours"
        wardStats:
          type: array
          items:
            type: object
            properties:
              ward:
                type: string
              total:
                type: integer
              pending:
                type: integer
        workerPerformance:
          type: array
          items:
            type: object
            properties:
              workerId:
                type: integer
              workerName:
                type: string
              assignedCount:
                type: integer
              resolvedCount:
                type: integer
              avgCompletionTime:
                type: number
              rating:
                type: number
                format: float

  parameters:
    ComplaintIdParam:
      name: complaintId
      in: path
      required: true
      schema:
        type: string
        pattern: '^CMP-\d{4}-\d{6}$'
      description: "Complaint ID in format CMP-YYYY-XXXXX"
      example: "CMP-2026-001234"

    BookingIdParam:
      name: bookingId
      in: path
      required: true
      schema:
        type: string
        pattern: '^BKG-\d{4}-\d{6}$'
      description: "Booking ID in format BKG-YYYY-XXXXX"
      example: "BKG-2026-001234"

    LimitParam:
      name: limit
      in: query
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 100
      description: "Maximum number of records to return"

    OffsetParam:
      name: offset
      in: query
      schema:
        type: integer
        default: 0
        minimum: 0
      description: "Number of records to skip for pagination"

  responses:
    UnauthorizedError:
      description: "JWT token is missing or invalid"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthenticationError'
          example:
            success: false
            message: "Authentication required. Please provide a valid JWT token."
            code: "AUTH_001"
            timestamp: "2026-08-01T10:30:00Z"

    ForbiddenError:
      description: "User does not have required role/permission"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthorizationError'
          example:
            success: false
            message: "Insufficient permissions. This endpoint requires 'Citizen' role."
            code: "AUTH_002"
            timestamp: "2026-08-01T10:30:00Z"

    ValidationError:
      description: "Request validation failed"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'
          example:
            success: false
            message: "Validation failed"
            errors:
              title:
                - "Title must be at least 5 characters"
                - "Title is required"
              category:
                - "Category must be one of: Road, Drainage, Electricity, Water, Garbage, Streetlight, Other"
              description:
                - "Description must be at least 30 characters"

    NotFoundError:
      description: "Resource not found"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: "Complaint not found"
            code: "RES_001"
            timestamp: "2026-08-01T10:30:00Z"

    ConflictError:
      description: "Resource conflict"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: "Feedback has already been submitted for this complaint"
            code: "CONF_001"
            timestamp: "2026-08-01T10:30:00Z"

    RateLimitError:
      description: "Rate limit exceeded"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: "Rate limit exceeded. Please try again after 60 seconds."
            code: "RATE_001"
            timestamp: "2026-08-01T10:30:00Z"

security:
  - BearerAuth: []

paths:
  # ============================================
  # AUTHENTICATION ENDPOINTS
  # ============================================
  /auth/register:
    post:
      tags:
        - Authentication
      summary: "US1, US4, US5, US6, US7, US8, US9 | Register as Citizen"
      description: |
        **User Stories:**
        - US1: Murali K GB - Register to submit complaints
        - US4: Ramakrishnan - Register to book facilities
        - US5: Priyanshu Singh - Register to report garbage issues
        - US6: Omkar Jaiswal - Register to report streetlight issues
        - US7: Mangalam Shrivastav - Register to report potholes
        - US8: Dhruv Raghav - Register to report dustbin issues
        - US9: Azhar Mohd - Register to report drainage issues
        
        Citizens can register with their details. Admin accounts cannot be created via registration endpoint.
      operationId: registerUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - fullName
                - email
                - mobile
                - role
                - address
                - city
                - state
                - pincode
                - password
              properties:
                fullName:
                  type: string
                  minLength: 3
                  maxLength: 100
                  example: "Murali K GB"
                email:
                  type: string
                  format: email
                  example: "murali@example.com"
                mobile:
                  type: string
                  pattern: '^[0-9]{10}$'
                  example: "9876543210"
                role:
                  type: string
                  enum: [Citizen, Officer, Worker]
                  description: "Only Citizen, Officer, or Worker roles can be created. Admin not allowed."
                  example: "Citizen"
                address:
                  type: string
                  minLength: 10
                  maxLength: 500
                  example: "123, MG Road, Brigade Area"
                city:
                  type: string
                  example: "Bengaluru"
                state:
                  type: string
                  example: "Karnataka"
                pincode:
                  type: string
                  pattern: '^[0-9]{6}$'
                  example: "560001"
                password:
                  type: string
                  minLength: 8
                  pattern: '^(?=.*[A-Za-z])(?=.*\d)[A-Za-z\d@$!%*?&]{8,}$'
                  description: "At least 8 characters with at least one letter and one number"
                  example: "Secure@123"
                gender:
                  type: string
                  enum: [Male, Female, Other]
                  example: "Male"
                dateOfBirth:
                  type: string
                  format: date
                  example: "1990-05-15"
            example:
              fullName: "Murali K GB"
              email: "murali@example.com"
              mobile: "9876543210"
              role: "Citizen"
              address: "123, MG Road, Brigade Area"
              city: "Bengaluru"
              state: "Karnataka"
              pincode: "560001"
              password: "Secure@123"
              gender: "Male"
      responses:
        '201':
          description: Registration successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Registration successful. Please verify your email."
                  userId:
                    type: integer
                    example: 1001
                  accountId:
                    type: string
                    example: "CVC-USR-1234"
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          description: Admin accounts cannot be created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: "Admin accounts cannot be created via registration."
                code: "AUTH_003"
                timestamp: "2026-08-01T10:30:00Z"
        '409':
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: "This email is already registered."
                code: "AUTH_004"
                timestamp: "2026-08-01T10:30:00Z"

  /auth/login:
    post:
      tags:
        - Authentication
      summary: "US1-US9 | Authenticate user"
      description: |
        **All User Stories:** All users need to login to access the platform.
        
        Valid credentials return JWT tokens and user information.
      operationId: loginUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: "murali@example.com"
                password:
                  type: string
                  example: "Secure@123"
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  access_token:
                    type: string
                    description: "JWT access token (expires in 15 minutes)"
                  refresh_token:
                    type: string
                    description: "JWT refresh token (expires in 7 days)"
                  token_type:
                    type: string
                    example: "Bearer"
                  expires_in:
                    type: integer
                    example: 900
                  user:
                    $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: "Invalid email or password."
                code: "AUTH_005"
                timestamp: "2026-08-01T10:30:00Z"
        '403':
          description: Account not active
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: "Your account is pending verification. Please check your email."
                code: "AUTH_006"
                timestamp: "2026-08-01T10:30:00Z"

  /auth/refresh:
    post:
      tags:
        - Authentication
      summary: Refresh access token
      description: |
        **All User Stories:** Users need to refresh their session.
        
        Exchange a valid refresh token for a new access token.
      operationId: refreshToken
      security:
        - BearerAuth: []
      responses:
        '200':
          description: New access token generated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  access_token:
                    type: string
                  expires_in:
                    type: integer
                    example: 900
        '401':
          description: Token revoked or invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: "Token has been revoked. Please log in again."
                code: "AUTH_007"
                timestamp: "2026-08-01T10:30:00Z"

  /auth/logout:
    post:
      tags:
        - Authentication
      summary: Logout user
      description: |
        **All User Stories:** Users need to log out securely.
        
        Revoke current access token and optionally a refresh token.
      operationId: logoutUser
      security:
        - BearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
