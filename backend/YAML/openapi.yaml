                        type: integer
                        example: 10
                      closed:
                        type: integer
                        example: 3
                      rejected:
                        type: integer
                        example: 2
                  category_breakdown:
                    type: object
                    additionalProperties:
                      type: integer
                    example:
                      Road: 12
                      Streetlight: 8
                      Garbage: 10
                      Drainage: 7
                      Electricity: 5
                      Water: 3
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /citizen/complaints/{complaintId}:
    get:
      tags:
        - Citizen Services
      summary: |
        **US1, US5, US6, US7, US8, US9**
        Get complaint details
      description: |
        **All Citizen Stories:** View full details of a specific complaint.
        
        Includes:
        - All complaint details with location
        - Images uploaded
        - Status history
        - Assignment details (officer/worker assigned)
        - Feedback if submitted
        - Escalation status
        
        **Security:** Only the complaint owner can view details.
      operationId: getComplaintDetails
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ComplaintIdParam'
      responses:
        '200':
